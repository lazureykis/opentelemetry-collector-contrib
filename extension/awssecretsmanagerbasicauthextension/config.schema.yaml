# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
title: AWS Secrets Manager Basic Auth Extension
description: Provides Basic Auth credentials sourced from AWS Secrets Manager.
type: object
properties:
  secret_arn:
    type: string
    description: ARN or name of the AWS Secrets Manager secret containing credentials.
  region:
    type: string
    description: AWS region. Defaults to the SDK default credential chain.
  refresh_interval:
    type: string
    description: How often to poll for credential rotation. Default 1h.
  username_key:
    type: string
    description: JSON key for the username field. Default "username".
  password_key:
    type: string
    description: JSON key for the password field. Default "password".
required:
  - secret_arn
